[book]
title = "Lustre 分布式文件系统：内核架构、协议演进与工程实战"
authors = ["Ringi", "Lustre Architecture & Engineering Team"]
description = "Lustre 分布式文件系统深度剖析：从内核驱动、LNet、LDLM、DNE、PFL/FLR 到 GDS 与生产容灾"
language = "zh-CN"
src = "."

[build]
build-dir = "dist"
create-missing = false

[output.html]
git-repository-url = "https://github.com/lilinji/lustre-book"
default-theme = "rust"
preferred-dark-theme = "coal"
mathjax-support = true
additional-css = ["theme/huashu.css"]

# Mermaid is vendored locally (not loaded from a CDN) so the HTML build and the
# headless-Chromium PDF export both work offline and render identically.
# mermaid.min.js must load first; mermaid-init.js converts the language-mermaid
# code fences into diagrams.
additional-js = ["js/mermaid.min.js", "js/mermaid-init.js"]
